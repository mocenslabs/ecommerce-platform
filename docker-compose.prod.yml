services:

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.prod

    command: >
      sh -c "
      python manage.py migrate &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --threads 2
      --timeout 120
      "

    env_file:
      - ./backend/.env.prod

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    expose:
      - "8000"

    depends_on:
      - db
      - redis

    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.prod

    command: >
      celery -A config worker
      --loglevel=info
      --queues=celery,inventory,orders,notifications,maintenance

    env_file:
      - ./backend/.env.prod

    depends_on:
      - db
      - redis

    restart: unless-stopped

  celery_beat:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.prod

    command: celery -A config beat -l info

    env_file:
      - ./backend/.env.prod

    depends_on:
      - db
      - redis

    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine

    ports:
    - "80:80"

    volumes:
      - ./backend/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static
      - media_volume:/media

    depends_on:
      - backend

    restart: unless-stopped

  db:
    image: postgres:17

    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  redis:
    image: redis:8

    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
