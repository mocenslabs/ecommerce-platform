version: 2

updates:

  # =========================================================
  # Python Backend (uv / pyproject.toml)
  # =========================================================

  - package-ecosystem: "pip"

    directory: "/backend"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 10

    labels:
      - dependencies
      - backend

  # =========================================================
  # GitHub Actions
  # =========================================================

  - package-ecosystem: "github-actions"

    directory: "/"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 5

    labels:
      - dependencies
      - github-actions
