services:

  # =========================================================
  # Django Backend
  # =========================================================

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile

    command: >
      sh -c "
      python manage.py migrate &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --threads 2
      --timeout 120
      "

    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env.dev

    depends_on:
      - db
      - redis

  # =========================================================
  # Celery Worker
  # =========================================================

  celery_worker:
    build:
     context: ./backend
     dockerfile: docker/Dockerfile

    command: >
      celery -A config worker
        --loglevel=info
        --queues=celery,inventory,orders,notifications,maintenance

    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

    env_file:
      - ./backend/.env.dev

    depends_on:
      - redis
      - db

  # =========================================================
  # Celery Beat
  # =========================================================

  celery_beat:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile

    command: celery -A config beat -l info

    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

    env_file:
      - ./backend/.env.dev

    depends_on:
      - redis
      - db

  # =========================================================
  # PostgreSQL
  # =========================================================

  db:
    image: postgres:17

    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  # =========================================================
  # Redis
  # =========================================================

  redis:
    image: redis:8

    ports:
      - "6379:6379"

volumes:
  postgres_data:
  backend_venv:
